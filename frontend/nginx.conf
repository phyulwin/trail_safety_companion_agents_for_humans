# nginx.conf - Preserve same-origin authentication and WebSocket upgrades.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream trail_backend {
    zone trail_backend 64k;
    server backend:8000 resolve;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    # Map providers need the application origin; never send private URL paths.
    add_header Referrer-Policy strict-origin always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        proxy_pass http://trail_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /ws/ {
        proxy_pass http://trail_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
