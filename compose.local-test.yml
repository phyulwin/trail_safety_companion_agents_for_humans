# compose.local-test.yml - Exercise production images with local TLS and isolated volumes.
services:
  backend:
    env_file: !override [.env.container]
    environment:
      CORS_ORIGINS: https://localhost:8443
  https:
    environment:
      TRAIL_HOST: localhost
    ports: !override ["127.0.0.1:8081:80", "127.0.0.1:8443:443"]
